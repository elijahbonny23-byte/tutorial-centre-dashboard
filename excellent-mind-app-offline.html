      /* No @import of web fonts here on purpose \u2014 this file must work with
         zero network access. Falls back to the best-matching system fonts:
         a serif for headings, system sans for body text, monospace for figures. */

      :root {
        --ink: #1B1B1F;
        --paper: #FAF6EC;
        --paper-raised: #FFFFFF;
        --navy: #1F3864;
        --navy-soft: #2E4A78;
        --brass: #B08D57;
        --brass-soft: #E7DCC4;
        --line: #DCD3BC;
        --paid: #2F6F4E;
        --paid-bg: #E4EEE7;
        --due: #9C4A3C;
        --due-bg: #F3E4E0;
      }

      * { box-sizing: border-box; }

      .app-shell {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: var(--ink);
        background: var(--paper);
        min-height: 100%;
        padding-bottom: 3rem;
      }

      .boot {
        padding: 4rem 2rem;
        text-align: center;
        font-family: 'Fraunces', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        color: var(--navy);
        font-size: 1.1rem;
      }

      .masthead {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.25rem 1.75rem;
        background: var(--navy);
        color: #fff;
        border-bottom: 3px solid var(--brass);
      }
      .masthead-seal {
        width: 42px; height: 42px;
        border: 2px solid var(--brass);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Fraunces', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        font-weight: 600;
        color: var(--brass);
        flex-shrink: 0;
      }
      .masthead-title {
        font-family: 'Fraunces', Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        font-weight: 600;
        font-size: 1.3rem;
        letter-spacing: 0.01em;
      }
      .masthead-sub {
        font-size: 0.8rem;
        color: var(--brass-soft);
        margin-top: 0.15rem;
      }
      .save-indicator {
        margin-left: auto;
        font-size: 0.75rem;
        color: var(--brass-soft);
        opacity: 0.85;
      }
      .backup-actions {
        display: flex;
        gap: 0.5rem;
      }
      .btn-header {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        color: #fff;
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--brass-soft);
        border-radius: 5px;
        padding: 0.4rem 0.7rem;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn-header:hover {
        background: rgba(255,255,255,0.16);
      }

      .tabs {
        display: flex;
        gap: 0.25rem;
        padding: 0.75rem 1.5rem 0;
